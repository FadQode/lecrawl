name: daily-crawl

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 07:00 WIB
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexcrawl
          POSTGRES_PASSWORD: lexcrawl
          POSTGRES_DB: lexcrawl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexcrawl -d lexcrawl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lexcrawl:lexcrawl@localhost:5432/lexcrawl
      STATE_BACKEND: db
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CRAWL_USER_AGENT: ${{ vars.CRAWL_USER_AGENT || 'LexCrawl/0.1' }}
      LISTINGS_URL: https://uaelegislation.gov.ae/ar/news
      RELEASES_API_URL: https://cba.ca/advantageapi/content/get/Article/en-us
      RELEASES_SITE_URL: https://cba.ca
      RELEASES_TYPE_ID: 6fe4eaca-ea7a-4e64-8147-49562f77b7a8
      REPORTS_LISTING_URL: https://www.commerce.gov/data-and-reports/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Run daily crawl
        run: uv run lexcrawl daily --source all
