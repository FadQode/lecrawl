name: daily-crawl

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 07:00 WIB
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # $ The crawl must persist checkpoints/identities/credits, so it uses a durable
    # $ external PostgreSQL (DATABASE_URL secret) rather than an ephemeral service container.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STATE_BACKEND: db
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CRAWL_USER_AGENT: ${{ vars.CRAWL_USER_AGENT || 'LexCrawl/0.1' }}
      LISTINGS_URL: https://uaelegislation.gov.ae/ar/news
      RELEASES_API_URL: https://cba.ca/advantageapi/content/get/Article/en-us
      RELEASES_SITE_URL: https://cba.ca
      RELEASES_TYPE_ID: 6fe4eaca-ea7a-4e64-8147-49562f77b7a8
      REPORTS_LISTING_URL: https://www.commerce.gov/data-and-reports/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.6
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Run daily crawl
        run: uv run lexcrawl daily --source all
