name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexcrawl
          POSTGRES_PASSWORD: lexcrawl
          POSTGRES_DB: lexcrawl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexcrawl -d lexcrawl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lexcrawl:lexcrawl@localhost:5432/lexcrawl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.6
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest (coverage >= 70%)
        run: uv run pytest --cov=lexcrawl --cov-fail-under=70
