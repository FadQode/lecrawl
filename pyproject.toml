[project]
name = "lexcrawl"
version = "0.1.0"
description = "Crawling and document-ingestion system for public legal, regulatory, and government sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "LexCrawl" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "selectolax>=0.3.21,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.3,<6.0",
    "pypdf>=5.1,<6.0",
    "python-dateutil>=2.9,<3.0",
    "apscheduler>=3.10,<4.0",
    "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2.0"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "respx>=0.22,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexcrawl"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lexcrawl"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database",
    "api: exercises the HTTP layer",
]
