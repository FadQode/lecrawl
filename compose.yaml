services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lexcrawl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: lexcrawl
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexcrawl -d lexcrawl"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      DB_HOST: db
      DB_USER: lexcrawl
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_NAME: lexcrawl
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      CRAWL_USER_AGENT: ${CRAWL_USER_AGENT:-LexCrawl/0.1}
      LISTINGS_URL: ${LISTINGS_URL:-https://uaelegislation.gov.ae/ar/news}
      RELEASES_API_URL: ${RELEASES_API_URL:-https://cba.ca/advantageapi/content/get/Article/en-us}
      RELEASES_SITE_URL: ${RELEASES_SITE_URL:-https://cba.ca}
      RELEASES_TYPE_ID: ${RELEASES_TYPE_ID:-6fe4eaca-ea7a-4e64-8147-49562f77b7a8}
      REPORTS_LISTING_URL: ${REPORTS_LISTING_URL:-https://www.commerce.gov/data-and-reports/reports}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "lexcrawl.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_env
    ports:
      - "8000:8000"
    volumes:
      - crawlstate:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    command: ["lexcrawl", "schedule"]
    environment: *app_env
    volumes:
      - crawlstate:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["lexcrawl", "worker"]
    environment: *app_env
    volumes:
      - crawlstate:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  resource-worker:
    build: .
    command: ["lexcrawl", "worker", "--queue", "resources"]
    environment: *app_env
    volumes:
      - crawlstate:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  # $ Persists the Firecrawl response cache (data/) across container recreation.$
  crawlstate:
