services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexcrawl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexcrawl}
      POSTGRES_DB: ${POSTGRES_DB:-lexcrawl}
    volumes:
      - lexcrawl-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexcrawl} -d ${POSTGRES_DB:-lexcrawl}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # $ The container reaches PostgreSQL on the compose network, not localhost.$
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lexcrawl}:${POSTGRES_PASSWORD:-lexcrawl}@db:5432/${POSTGRES_DB:-lexcrawl}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      SCHEDULE_DAILY_CRON: ${SCHEDULE_DAILY_CRON:-0 3 * * *}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-UTC}
      MANUAL_TRIGGER_TOKEN: ${MANUAL_TRIGGER_TOKEN:-}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  lexcrawl-postgres:
